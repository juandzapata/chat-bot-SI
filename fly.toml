app = "chatbot-rag-api"
primary_region = "mia"

[build]
  dockerfile = "docker/Dockerfile.api"

[env]
  USE_EMBEDDED_CHROMA = "true"
  CHROMA_PERSIST_DIR = "/data/vector_store"
  MODE = "production"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "vector_store"
  destination = "/data/vector_store"
